# Local development database only. Production uses a managed Postgres (see README).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: release_readiness
    ports:
      # 5434 avoids clashing with a host Postgres on 5432.
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d release_readiness"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
